name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install numpy pyyaml
      - name: Compile Python sources
        run: python -m compileall -q docker training_code verification
      - name: Self-check prediction comparator
        run: python verification/compare_to_oracle.py --pred verification/oracle_d7.json --oracle verification/oracle_d7.json
      - name: Verify submitted Docker file checksums
        shell: bash
        run: |
          python - <<'EOF'
          import hashlib
          import pathlib
          import re

          checksums = pathlib.Path("verification/CHECKSUMS.txt").read_text()
          expected = {
              name: digest
              for digest, name in re.findall(r"^([0-9a-f]{32})  (\S+)$", checksums, re.MULTILINE)
          }
          for name in ("predict.py", "model.py", "requirements.txt", "Dockerfile"):
              actual = hashlib.md5((pathlib.Path("docker") / name).read_bytes()).hexdigest()
              if actual != expected.get(name):
                  raise SystemExit(f"md5 mismatch for {name}: {actual} != {expected.get(name)}")

          inventory = pathlib.Path("docker/vendor/INVENTORY.md").read_text()
          shipped_section = inventory.split("## On the inference import path (shipped here)", 1)[1]
          shipped_section = shipped_section.split("## md5 of every module in the image, as built", 1)[1]
          vendor_root = pathlib.Path("docker/vendor")
          for digest, name in re.findall(r"^([0-9a-f]{32})  (\S+)$", shipped_section, re.MULTILINE):
              path = vendor_root / name
              if path.exists():
                  actual = hashlib.md5(path.read_bytes()).hexdigest()
                  if actual != digest:
                      raise SystemExit(f"md5 mismatch for {path}: {actual} != {digest}")

          checkpoint_lines = {
              f"{digest}  {name}"
              for digest, name in re.findall(r"^([0-9a-f]{64})  (\S+\.pth)$", checksums, re.MULTILINE)
              if name != "best_model.pth"
          }
          weights_lines = {
              line for line in pathlib.Path("verification/weights.sha256").read_text().splitlines()
              if line
          }
          if checkpoint_lines != weights_lines:
              raise SystemExit("verification/weights.sha256 does not match checkpoint hashes")
          EOF
      - name: Validate citation metadata
        run: python -c "import yaml,sys; yaml.safe_load(open('CITATION.cff'))"
